services:
  # Backend server with preprocessing capabilities
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stratum3D_server
    ports:
      # Bind to localhost only — access goes through Apache/nginx reverse proxy in production.
      # For direct access without a reverse proxy, change to "3000:3000".
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount input folder for preprocessing
      - ./input:/app/input:ro
      # Mount data folder to persist processed files
      - ./server/data:/app/server/data
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      # Overrides the value from root .env — change here or set CORS_ORIGINS in .env.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-true}
    command: node index.js
    networks:
      - stratum3D_network

  # Frontend client (production build with nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SITE_TITLE: ${VITE_SITE_TITLE:-Stratum3D}
        VITE_SITE_FAVICON: ${VITE_SITE_FAVICON:-/favicon.svg}
        VITE_BUG_REPORT: ${VITE_BUG_REPORT:-auto}
        VITE_DEBUG_MODE: ${VITE_DEBUG_MODE:-false}
        VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-auto}
    container_name: stratum3D_client
    ports:
      # Bind to localhost only — access goes through Apache/nginx reverse proxy in production.
      # For direct access without a reverse proxy, change to "8080:80".
      - "127.0.0.1:8080:80"
    depends_on:
      - server
    networks:
      - stratum3D_network


networks:
  stratum3D_network:
    driver: bridge
