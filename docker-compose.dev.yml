# Development-specific overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  client:
    profiles:
      - prod  # Disable production nginx in dev mode; use client-dev instead

  server:
    volumes:
      - ./server/data:/app/server/data
      # Hot-reload: mount source code over the image
      - ./server:/app/server
      - /app/server/node_modules
    environment:
      - NODE_ENV=development
      - CORS_ORIGINS=http://localhost:5173
    command: sh -c "npm install && npm run dev"

  client-dev:
    image: node:20-alpine
    container_name: stratum3D_client_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - server
    networks:
      - stratum3D_network
