# Development-specific overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  client:
    profiles:
      - prod  # Disable production nginx in dev mode; use client-dev instead

  server:
    # Run as the host user so that files in the mounted data directory can be
    # read, written, and deleted by the server regardless of who created them.
    # On most Linux systems the first non-root user is UID/GID 1000.
    user: "1000:1000"
    volumes:
      - ./server/data:/app/server/data
      # Hot-reload: mount source code over the image.
      # The anonymous node_modules override is intentionally omitted here so
      # that npm uses the host's ./server/node_modules (also owned by UID 1000)
      # instead of the Docker-managed volume that was created as UID 1001.
      - ./server:/app/server
    environment:
      - NODE_ENV=development
      - CORS_ORIGINS=http://localhost:5173
    command: sh -c "npm install && npm run dev"

  client-dev:
    image: node:20-alpine
    container_name: stratum3D_client_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - server
    networks:
      - stratum3D_network
